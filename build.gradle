buildscript {
    dependencies {
        classpath 'mysql:mysql-connector-java:8.0.27'
    }
}

plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot' version '2.7.9'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id "com.diffplug.spotless" version '6.25.0'
    id "org.flywaydb.flyway" version "8.2.0"
    id 'jacoco'
    id 'jacoco-report-aggregation'
    id 'java-test-fixtures'
}

flyway {
    table = 'flyway_shecma_history_boot2_hexagonal'
    locations = ["filesystem:.flyway/${project.properties['flyway-vendor']}"]
    baselineOnMigrate = true
    baselineVersion = '0'
    configFiles = [".flyway/config/${project.properties['flyway-profile']}.conf"]
}

apply from: rootProject.file('gradle/install-git-hooks.gradle')

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'groovy'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: "com.diffplug.spotless"
    apply plugin: 'jacoco'
    apply plugin: 'java-test-fixtures'

    java {
        sourceCompatibility = '17'
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
        all {
            resolutionStrategy {
                // cache dynamic versions for 3 minutes
                cacheDynamicVersionsFor 3 * 60, 'seconds'
                // don't cache changing modules at all
                cacheChangingModulesFor 3 * 60, 'seconds'
            }
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation 'io.swagger.core.v3:swagger-annotations:2.2.22'

        compileOnly 'org.projectlombok:lombok'

        annotationProcessor 'org.projectlombok:lombok'

        testCompileOnly 'org.projectlombok:lombok'

        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.security:spring-security-test'
        testImplementation 'com.fasterxml.jackson.core:jackson-databind'
        testImplementation "org.spockframework:spock-core:2.4-M1-groovy-4.0"
        testImplementation "org.spockframework:spock-spring:2.4-M1-groovy-4.0"
        testImplementation "org.apache.groovy:groovy:4.0.11"
        testImplementation "org.apache.groovy:groovy-json:4.0.11"
        testImplementation "com.squareup.okhttp3:okhttp:4.9.3"
        testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
        testImplementation(testFixtures(project(':api')))
    }

    spotless {
        format 'misc', {
            target '*.gradle', '*.md', '.gitignore'

            trimTrailingWhitespace()
            indentWithSpaces(2)
            endWithNewline()
        }
        java {
            importOrder()
            removeUnusedImports()
            indentWithSpaces(2)
            googleJavaFormat()
            formatAnnotations()
        }

        groovy {
            importOrder()
            excludeJava()
        }
    }

    jacoco {
        toolVersion = '0.8.8'
    }

    test {
        useJUnitPlatform()

        finalizedBy 'jacocoTestReport'
    }

    tasks.withType(Test).configureEach {
        // 테스트 실행 중 매번 로그를 출력하도록
        outputs.upToDateWhen { false }

        testLogging {
            // 모든 테스트 이벤트를 콘솔에 출력
            events "started", "skipped", "passed"
            events "failed", "standardOut", "standardError"

            // 예외는 전체 스택트레이스로 출력
            exceptionFormat = "full"

            // System.out / System.err 전부 출력
            showStandardStreams = true
        }

        // 테스트 병렬화로 인해 로그가 섞이지 않도록 필요 시 제한
         maxParallelForks = 1
    }


    jacocoTestReport {
        dependsOn test

        reports {
            xml.enabled true
            html.enabled true
        }

        finalizedBy 'jacocoTestCoverageVerification'
    }

    afterEvaluate { subproject ->
        if (subproject.hasProperty('test')) {
            //noinspection GrUnresolvedAccess
            rootProject.testReport.reportOn subproject.test
            rootProject.dependencies {
                //noinspection GrUnresolvedAccess
                jacocoAggregation subproject
            }
        }
    }
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

tasks.register('testReport', TestReport) {
    destinationDirectory = file("$buildDir/reports/tests/test")
}

tasks.register('printProjectDirs') {
    doLast {
        subprojects.forEach { println(rootProject.projectDir.relativePath(it.projectDir)) }
    }
}

test {
    useJUnitPlatform()
    exclude '**/*'
    //noinspection GrUnresolvedAccess
    finalizedBy jacocoTestReport, testCodeCoverageReport, testReport
}
